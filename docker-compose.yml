services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ordering-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Ordering!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ordering-mssql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # SQL Server has no POSTGRES_DB equivalent: this one-shot job creates the database once db is healthy.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ordering-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Ordering!Passw0rd"
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"IF DB_ID('Ordering') IS NULL CREATE DATABASE Ordering;\""]
    restart: "no"

volumes:
  ordering-mssql:
